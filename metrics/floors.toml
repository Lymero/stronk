# Quality floors (docs/architecture.md, section 7). Checked by `just check`.
#
# Floors only tighten. Loosening one (raising a `max`, lowering a `min`, or turning `enforce`
# off) fails the check unless docs/decisions.md names the metric.
#
# Each floor reads `metric` from the JSON file `source`. A floor without a threshold, or with
# `enforce = false`, is reported but never fails.

# Synthetic truth (tools/synth, 8 seeds). WPA v1 reference with the M0 baseline WP model.
# Measured 2026-10-16: clean MAE 0.0035, confounded MAE 0.0052, coverage 1.0 and 0.875,
# planted bias 0.0015 and 0.0061.

[[floor]]
metric = "synthetic.clean.mean_abs_error"
source = "metrics/out/synthetic.json"
max = 0.0045

[[floor]]
metric = "synthetic.confounded.mean_abs_error"
source = "metrics/out/synthetic.json"
max = 0.0065

[[floor]]
metric = "synthetic.clean.coverage"
source = "metrics/out/synthetic.json"
min = 0.9

[[floor]]
metric = "synthetic.confounded.coverage"
source = "metrics/out/synthetic.json"
min = 0.8

[[floor]]
metric = "synthetic.confounded.planted_bias"
source = "metrics/out/synthetic.json"
min = -0.008
max = 0.008

[[floor]]
metric = "synthetic.clean.meta_lock_flagged"
source = "metrics/out/synthetic.json"
min = 1.0

[[floor]]
metric = "synthetic.confounded.meta_lock_flagged"
source = "metrics/out/synthetic.json"
min = 1.0

# Many-option slot with a rare tail (slot 4, ADR-035) and false discovery control (ADR-036).
# Measured 2026-10-18: common options estimated 1.0, tail flagged 1.0 in both scenarios; the
# planted effects (A, G) are called clear in 13 of 16 seed-scenario pairs against the most
# played option (ADR-036).

[[floor]]
metric = "synthetic.clean.common_options_estimated"
source = "metrics/out/synthetic.json"
min = 1.0

[[floor]]
metric = "synthetic.clean.long_tail_flagged"
source = "metrics/out/synthetic.json"
min = 1.0

[[floor]]
metric = "synthetic.clean.planted_clear"
source = "metrics/out/synthetic.json"
min = 0.75

[[floor]]
metric = "synthetic.confounded.common_options_estimated"
source = "metrics/out/synthetic.json"
min = 1.0

[[floor]]
metric = "synthetic.confounded.long_tail_flagged"
source = "metrics/out/synthetic.json"
min = 1.0

[[floor]]
metric = "synthetic.confounded.planted_clear"
source = "metrics/out/synthetic.json"
min = 0.75

# Overlap-weighted estimator (ADR-037), reported but not enforced: it becomes the default only
# when G keeps about +3%, the other planted effects stay right and every floor above holds for
# it. Measured 2026-10-18: G keeps 99% (v1 54%), but confounded planted bias 0.0096 and
# coverage 0.75 (v1 0.0036 and 1.0).

[[floor]]
metric = "synthetic.confounded.g_share_kept"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.clean.g_share_kept"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.clean.planted_bias"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.clean.coverage"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.clean.mean_abs_error"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.confounded.g_share_kept"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.confounded.planted_bias"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.confounded.coverage"
source = "metrics/out/synthetic.json"

[[floor]]
metric = "synthetic.overlap_weighted.confounded.mean_abs_error"
source = "metrics/out/synthetic.json"

# Win probability and extract on the corpora (ADR-038), each floor set from its own corpus's
# baseline: test matches never seen in training or model choice, logistic model chosen.
# crawl-ci-16.20 (3500 games stratified by region, 525 test matches), measured 2026-10-18 by
# `just check`: log loss 0.5308, calibration error 0.0114, skip rate 0.

[[floor]]
metric = "winprob.ci.calibration_error"
source = "metrics/out/winprob-ci.json"
max = 0.013

[[floor]]
metric = "winprob.ci.log_loss"
source = "metrics/out/winprob-ci.json"
max = 0.535

[[floor]]
metric = "extract.ci.skip_rate"
source = "metrics/out/extract-ci.json"
max = 0.01

# crawl-all-16.20 (22954 games, 3443 test matches), measured 2026-10-18 by the weekly job
# (`just floors-full`): log loss 0.5215, calibration error 0.0082, skip rate 0.

[[floor]]
metric = "winprob.full.calibration_error"
source = "metrics/out/winprob-full.json"
suite = "full"
max = 0.0095

[[floor]]
metric = "winprob.full.log_loss"
source = "metrics/out/winprob-full.json"
suite = "full"
max = 0.525

[[floor]]
metric = "extract.full.skip_rate"
source = "metrics/out/extract-full.json"
suite = "full"
max = 0.01

# Set once the stage exists (M2: coverage; M5: backtests).

[[floor]]
metric = "coverage.confident_pairs_share"
source = "metrics/out/coverage.json"
enforce = false

[[floor]]
metric = "backtest.direction_share"
source = "metrics/out/backtest.json"
enforce = false

# Pipeline on the committed live recording (`just pipeline`). Skip rate: games lost to a failure
# (quarantined by the crawl, or dropped whole by extract) over games attempted. Measured
# 2026-10-18: 0 on the fixture and on the corpora; the first crawl, before the two
# live-payload fixes (ADR-028), would have been about 0.09.
[[floor]]
metric = "pipeline.skip_rate"
source = "metrics/out/pipeline.json"
max = 0.01

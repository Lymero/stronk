name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/generated/rust
      - uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-ci-${{ hashFiles('corpus.lock') }}
      - run: just setup
      - run: just corpus crawl-ci-16.20
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm --filter @stronk/ui exec playwright install --with-deps chromium
      - run: just check

  # The Tauri shell needs WebKitGTK, so it builds here rather than in `just check` (ADR-040).
  app-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/core
      - run: pnpm install --frozen-lockfile
      - run: just app-build

  # The League client runs on Windows: build and test the app there (docs/windows.md).
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24.22.0"
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/core
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stronk/ui test
      - run: pnpm --filter @stronk/ui build
      - run: cargo test --manifest-path app/core/Cargo.toml --locked --quiet
      - run: cargo clippy --manifest-path app/core/Cargo.toml -p stronk-app --all-targets --locked --quiet -- -D warnings
      - run: cargo build --manifest-path app/core/Cargo.toml --locked -p stronk-cli -p stronk-app
      - run: uv sync --all-packages --locked
      - run: uv run pytest -q tools/lcu_mock
        env:
          STRONK_CORE_BIN: ${{ github.workspace }}/app/core/target/debug/stronk-core.exe

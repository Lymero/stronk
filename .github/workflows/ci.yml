name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/generated/rust
      - uses: actions/cache@v4
        with:
          path: corpus
          key: corpus-ci-${{ hashFiles('corpus.lock') }}
      - run: just setup
      - run: just corpus crawl-ci-16.20
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: just check

  # The Tauri shell needs WebKitGTK, so it builds here rather than in `just check` (ADR-040).
  app-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/pnpm/store
          key: deps-${{ hashFiles('uv.lock', 'pnpm-lock.yaml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/core
      - run: pnpm install --frozen-lockfile
      - run: just app-build

[package]
name = "stronk-web"
description = "The web build viewer's core, built to WebAssembly: published data checked against its signature, and plans made by the app's own rule (ADR-086)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stronk-contracts = { path = "../../../../contracts/generated/rust" }
stronk-data = { path = "../data", default-features = false }
stronk-domain = { path = "../domain" }
stronk-service = { path = "../service" }
wasm-bindgen = "=0.2.130"

[lints]
workspace = true

[package]
name = "stronk-lcu"
description = "LeagueClient adapter: lockfile discovery, HTTPS to the local client, typed models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stronk-domain = { path = "../domain" }
stronk-service = { path = "../service" }
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["net", "time", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
x509-parser = { version = "0.18", features = ["verify"] }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package]
name = "stronk-lcu"
description = "LeagueClient adapter: lockfile discovery, HTTPS to the local client, typed models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stronk-domain = { path = "../domain" }
stronk-service = { path = "../service" }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[lints]
workspace = true

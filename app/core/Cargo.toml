[workspace]
resolver = "3"
members = ["crates/domain", "crates/service", "crates/data", "crates/lcu", "crates/cli", "src-tauri"]
# The Tauri shell needs WebKitGTK to build on Linux; `just check` builds everything else, CI
# builds the shell too (`just app-build`).
default-members = ["crates/domain", "crates/service", "crates/data", "crates/lcu", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"

<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" role="img" aria-label="Activity diagram in two lanes: publish hashes the files, writes and signs the manifest; the app reads the index, revalidates the manifest, checks its signature and each file's hash, caching on success and keeping the last verified cache on failure.">
<style>
svg {
  --bg: #f4f6f8; --panel: #ffffff; --zone: #e9edf1; --fg: #15202b; --muted: #586474; --line: #b9c3ce;
  --accent: #0b7480; --accent-bg: #e1f1f2; --new: #a65f00; --new-bg: #fff2dc; --ext: #6a55c8; --ext-bg: #efecfb; --chg: #c0267a; --chg-bg: #fde6f0; --py: #2b5fab; --py-bg: #e7eef9; --rs: #b3412a; --rs-bg: #fbeae5; --ts: #2f7d3a; --ts-bg: #e5f2e4;
   --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg text { font-family: var(--f-body); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #0e1319; --panel: #18212b; --zone: #131a22; --fg: #e3e9ef; --muted: #95a3b2; --line: #3a4757;
  --accent: #4fc1cb; --accent-bg: #12303a; --new: #f2b14c; --new-bg: #2e2412; --ext: #a998f0; --ext-bg: #211d36; --chg: #ff7ab8; --chg-bg: #3a1429; --py: #8db4ee; --py-bg: #182a44; --rs: #f08c72; --rs-bg: #3a1f18; --ts: #7fcf88; --ts-bg: #16301a;  } }
.zn { fill: var(--zone); stroke: var(--line); }
.zt { fill: var(--muted); font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.bx { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.bx.acc { fill: var(--accent-bg); stroke: var(--accent); }
.bx.py { fill: var(--py-bg); stroke: var(--py); }
.bx.rs { fill: var(--rs-bg); stroke: var(--rs); }
.bx.ts { fill: var(--ts-bg); stroke: var(--ts); }
.ex { fill: var(--ext-bg); stroke: var(--ext); stroke-width: 1.2; }
.pl { fill: var(--new-bg); stroke: var(--new); stroke-width: 1.3; stroke-dasharray: 5 3; }
.fl { fill: var(--bg); stroke: var(--line); stroke-dasharray: 3 3; }
.t { fill: var(--fg); font-size: 12.5px; }
.tb { fill: var(--fg); font-size: 13px; font-weight: 600; }
.ts { fill: var(--muted); font-size: 11.5px; }
.tm { fill: var(--fg); font: 11px var(--f-mono); }
.tp { fill: var(--new); font: 11px var(--f-mono); }
.el { fill: var(--muted); font-size: 11px; }
.ed { stroke: var(--fg); stroke-width: 1.3; fill: none; }
.ed.dash { stroke-dasharray: 4 3; }
.ed.np { stroke: var(--new); stroke-dasharray: 5 3; }
.ll { stroke: var(--line); stroke-dasharray: 3 4; }
.ah { fill: var(--fg); }
.ahn { fill: var(--new); }
.fresh rect, rect.fresh { stroke: var(--chg); stroke-width: 2.6; stroke-dasharray: none; fill: var(--chg-bg); }
.fresh .ed, path.fresh { stroke: var(--chg); stroke-width: 2.2; }
.fresh .t, .fresh .ts, .fresh .tm, .fresh .zt, text.fresh { fill: var(--chg); font-weight: 600; }
.mo path { fill: none; stroke: var(--fg); stroke-width: 1.2; stroke-dasharray: none; }
.mon path { fill: none; stroke: var(--new); stroke-width: 1.2; stroke-dasharray: none; }
.mt path { fill: var(--panel); stroke: var(--fg); stroke-width: 1.1; stroke-dasharray: none; }
.mf path { fill: var(--fg); }
.cir { fill: var(--panel); stroke: var(--muted); stroke-width: 1; }
.face { fill: var(--line); opacity: .6; }
.tmb { fill: var(--fg); font: 600 11.5px var(--f-mono); }
.dot { fill: var(--fg); }
.endo { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.frag { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.fragtag { fill: var(--zone); stroke: var(--muted); stroke-width: 1.2; }
.note { fill: var(--panel); stroke: var(--muted); stroke-width: 1.1; }
.lane { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dia { fill: var(--panel); stroke: var(--fg); stroke-width: 1.2; }
</style>
<rect width="100%" height="100%" style="fill:var(--panel)"/>
      <defs>
        <marker id="f5" class="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z"/></marker>
      </defs>
      <rect class="lane" x="10" y="10" width="1040" height="92"/>
      <rect class="lane" x="10" y="102" width="1040" height="188"/>
      <line class="lane" x1="118" y1="10" x2="118" y2="290"/>
      <text class="tb" x="20" y="52">publish</text><text class="ts" x="20" y="69">pipeline</text>
      <text class="tb" x="20" y="190">HttpSource</text><text class="ts" x="20" y="207">data crate</text>

      <circle class="dot" cx="142" cy="56" r="7"/>
      <path class="ed" d="M149,56 H166" marker-end="url(#f5)"/>
      <rect class="bx py" x="168" y="36" width="150" height="40" rx="12"/><text class="t" x="180" y="60">hash every file</text>
      <path class="ed" d="M318,56 H340" marker-end="url(#f5)"/>
      <rect class="bx py" x="342" y="36" width="170" height="40" rx="12"/><text class="t" x="354" y="60">write manifest.json</text>
      <path class="ed" d="M512,56 H534" marker-end="url(#f5)"/>
      <rect class="bx py" x="536" y="36" width="170" height="40" rx="12"/><text class="t" x="548" y="60">sign it (minisign)</text>
      <path class="ed" d="M706,56 H728" marker-end="url(#f5)"/>
      <rect class="bx" x="730" y="30" width="190" height="52"/><text class="tm" x="740" y="51">index.json (unsigned)</text><text class="tm" x="740" y="69">manifest + .minisig, files</text>
      <path class="ed" d="M825,82 V116 H210 V130" marker-end="url(#f5)"/>

      <rect class="bx rs" x="135" y="132" width="150" height="46" rx="12"/><text class="t" x="147" y="151">read index.json,</text><text class="t" x="147" y="167">never an older patch</text>
      <path class="ed" d="M285,155 H307" marker-end="url(#f5)"/>
      <rect class="bx rs" x="309" y="132" width="160" height="46" rx="12"/><text class="t" x="321" y="151">revalidate manifest</text><text class="t" x="321" y="167">(ETag, ≤ every 5 min)</text>
      <path class="ed" d="M469,155 H491" marker-end="url(#f5)"/>
      <rect class="bx rs" x="493" y="132" width="160" height="46" rx="12"/><text class="t" x="505" y="151">check signature with</text><text class="t" x="505" y="167">the built-in key</text>
      <path class="ed" d="M653,155 H674" marker-end="url(#f5)"/>
      <path class="dia" d="M690,141 L704,155 L690,169 L676,155 Z"/>
      <path class="ed" d="M704,155 H724" marker-end="url(#f5)"/><text class="el" x="705" y="148">[ok]</text>
      <rect class="bx rs" x="726" y="132" width="130" height="46" rx="12"/><text class="t" x="738" y="151">check each file's</text><text class="t" x="738" y="167">size and sha256</text>
      <path class="ed" d="M856,155 H864" marker-end="url(#f5)"/>
      <path class="dia" d="M880,141 L894,155 L880,169 L866,155 Z"/>
      <path class="ed" d="M894,155 H918" marker-end="url(#f5)"/><text class="el" x="895" y="148">[ok]</text>
      <rect class="bx rs" x="920" y="132" width="120" height="46" rx="12"/><text class="t" x="932" y="151">cache it,</text><text class="t" x="932" y="167">serve it</text>
      <path class="ed" d="M980,178 V200" marker-end="url(#f5)"/>
      <circle class="endo" cx="980" cy="210" r="9"/><circle class="dot" cx="980" cy="210" r="4.5"/>

      <path class="ed" d="M690,169 V226" marker-end="url(#f5)"/><text class="el" x="696" y="200">[bad]</text>
      <path class="ed" d="M880,169 V248 H862" marker-end="url(#f5)"/><text class="el" x="886" y="200">[bad]</text>
      <rect class="bx rs" x="600" y="228" width="260" height="40" rx="12"/><text class="t" x="612" y="252">reject; serve the last verified cache</text>
      <path class="ed" d="M600,248 H584" marker-end="url(#f5)"/>
      <circle class="endo" cx="573" cy="248" r="9"/><circle class="dot" cx="573" cy="248" r="4.5"/>
    </svg>

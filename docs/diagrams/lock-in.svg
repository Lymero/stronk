<svg xmlns="http://www.w3.org/2000/svg" width="1265" height="1162" viewBox="0 0 1265 1162" role="img" aria-label="Sequence diagram: on hover the UI gets the state and a plan from the core; on lock-in, if auto-import is on, build.import reads the session, gets the cached build and writes runes, item set and spells to the client.">
<style>
svg {
  --bg: #f4f6f8; --panel: #ffffff; --zone: #e9edf1; --fg: #15202b; --muted: #586474; --line: #b9c3ce;
  --accent: #0b7480; --accent-bg: #e1f1f2; --new: #a65f00; --new-bg: #fff2dc; --ext: #6a55c8; --ext-bg: #efecfb; --chg: #c0267a; --chg-bg: #fde6f0; --py: #2b5fab; --py-bg: #e7eef9; --rs: #b3412a; --rs-bg: #fbeae5; --ts: #2f7d3a; --ts-bg: #e5f2e4;
   --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
svg text { font-family: var(--f-body); }
@media (prefers-color-scheme: dark) { svg {
  --bg: #0e1319; --panel: #18212b; --zone: #131a22; --fg: #e3e9ef; --muted: #95a3b2; --line: #3a4757;
  --accent: #4fc1cb; --accent-bg: #12303a; --new: #f2b14c; --new-bg: #2e2412; --ext: #a998f0; --ext-bg: #211d36; --chg: #ff7ab8; --chg-bg: #3a1429; --py: #8db4ee; --py-bg: #182a44; --rs: #f08c72; --rs-bg: #3a1f18; --ts: #7fcf88; --ts-bg: #16301a;  } }
.zn { fill: var(--zone); stroke: var(--line); }
.zt { fill: var(--muted); font: 600 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.bx { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.bx.acc { fill: var(--accent-bg); stroke: var(--accent); }
.bx.py { fill: var(--py-bg); stroke: var(--py); }
.bx.rs { fill: var(--rs-bg); stroke: var(--rs); }
.bx.ts { fill: var(--ts-bg); stroke: var(--ts); }
.ex { fill: var(--ext-bg); stroke: var(--ext); stroke-width: 1.2; }
.pl { fill: var(--new-bg); stroke: var(--new); stroke-width: 1.3; stroke-dasharray: 5 3; }
.fl { fill: var(--bg); stroke: var(--line); stroke-dasharray: 3 3; }
.t { fill: var(--fg); font-size: 12.5px; }
.tb { fill: var(--fg); font-size: 13px; font-weight: 600; }
.ts { fill: var(--muted); font-size: 11.5px; }
.tm { fill: var(--fg); font: 11px var(--f-mono); }
.tp { fill: var(--new); font: 11px var(--f-mono); }
.el { fill: var(--muted); font-size: 11px; }
.ed { stroke: var(--fg); stroke-width: 1.3; fill: none; }
.ed.dash { stroke-dasharray: 4 3; }
.ed.np { stroke: var(--new); stroke-dasharray: 5 3; }
.ll { stroke: var(--line); stroke-dasharray: 3 4; }
.ah { fill: var(--fg); }
.ahn { fill: var(--new); }
.fresh rect, rect.fresh { stroke: var(--chg); stroke-width: 2.6; stroke-dasharray: none; fill: var(--chg-bg); }
.fresh .ed, path.fresh { stroke: var(--chg); stroke-width: 2.2; }
.fresh .t, .fresh .ts, .fresh .tm, .fresh .zt, text.fresh { fill: var(--chg); font-weight: 600; }
.mo path { fill: none; stroke: var(--fg); stroke-width: 1.2; stroke-dasharray: none; }
.mon path { fill: none; stroke: var(--new); stroke-width: 1.2; stroke-dasharray: none; }
.mt path { fill: var(--panel); stroke: var(--fg); stroke-width: 1.1; stroke-dasharray: none; }
.mf path { fill: var(--fg); }
.cir { fill: var(--panel); stroke: var(--muted); stroke-width: 1; }
.face { fill: var(--line); opacity: .6; }
.tmb { fill: var(--fg); font: 600 11.5px var(--f-mono); }
.dot { fill: var(--fg); }
.endo { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.frag { fill: none; stroke: var(--muted); stroke-width: 1.2; }
.fragtag { fill: var(--zone); stroke: var(--muted); stroke-width: 1.2; }
.note { fill: var(--panel); stroke: var(--muted); stroke-width: 1.1; }
.lane { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dia { fill: var(--panel); stroke: var(--fg); stroke-width: 1.2; }
</style>
